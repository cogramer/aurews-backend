version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: aurews-meilisearch
    environment:
      - MEILISEARCH_MASTER_KEY=aurews-meili-keke
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - ./meilisearch_data:/meilisearch_data
    restart: unless-stopped

volumes:
  meilisearch_data:
